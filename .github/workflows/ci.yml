name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --package-lock=false
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: node examples/node-example.mjs
      - run: node -e "const u = require('./dist/index.cjs'); if (u.formatINR(1.005) !== '?1.01') process.exit(1)"
      - run: npm pack --dry-run
